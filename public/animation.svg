<svg xmlns="http://www.w3.org/2000/svg" viewBox="-160 -160 320 320" width="600" height="600" role="img" aria-label="HDFC Life" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>HDFC Life — a pulse completes the seal, then keeps beating</title>

<style>
  :root{ --red:#E4181F; --ink:#171213; --grey:#7B7375; --hair:#ECE6E7; }

  .ticks{ animation:spin 90s linear infinite; transform-origin:0 0; }
  .tick{ stroke:var(--hair); stroke-width:1.3; }
  .tick.major{ stroke:#DED6D7; stroke-width:1.8; }

  .ring-track{ fill:none; stroke:var(--hair); stroke-width:1.5; }

  .ring-fill{
    fill:none; stroke:var(--red); stroke-width:2.6; stroke-linecap:round;
    transform-origin:0 0;
    stroke-dasharray:754; stroke-dashoffset:754;
    animation:reveal 2.8s cubic-bezier(.4,.05,.2,1) .35s forwards;
  }

  .rider{
    offset-path: path('M 0 -120 A 120 120 0 1 1 -0.1 -120 Z');
    offset-distance:0%;
    offset-rotate:0deg;
    animation:
      ride 2.8s cubic-bezier(.4,.05,.2,1) .35s forwards,
      heartbeat 1.05s ease-in-out 3.15s infinite;
  }
  .rider .r-halo{ fill:var(--red); opacity:.16; }
  .rider .r-dot{ fill:var(--red); }
  .rider .r-blip{ stroke:#fff; stroke-width:1.7; fill:none; stroke-linecap:round; stroke-linejoin:round; }

  .plate{ fill:#fff; }

  /* real, legible wordmark — fades and settles in, doesn't rely on hand-drawn letterforms */
  .brand{ opacity:0; transform:translateY(10px); transform-origin:0 20px; }
  .brand{ animation:rise .8s cubic-bezier(.2,.7,.25,1) 3.35s forwards; }
  .brand .hdfc{
    font:800 34px "Inter Tight", "Segoe UI", system-ui, sans-serif;
    letter-spacing:.5px; fill:var(--ink);
  }
  .brand .life{
    font:800 34px "Inter Tight", "Segoe UI", system-ui, sans-serif;
    letter-spacing:.5px; fill:var(--red);
  }

  .tag{
    font:600 12px "Inter Tight", system-ui, sans-serif;
    letter-spacing:3px; fill:var(--grey);
    opacity:0; transform:translateY(6px); transform-origin:0 90px;
    animation:rise .7s ease-out 4.2s forwards;
  }

  .ripple{
    fill:none; stroke:var(--red); stroke-width:1.4; opacity:0;
    transform-origin:0 0; transform-box:fill-box;
    animation:ripple 2.8s cubic-bezier(.2,.7,.3,1) infinite;
  }
  .ripple.r2{ animation-delay:1.4s; }

  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes reveal{ to{ stroke-dashoffset:0; } }
  @keyframes ride{ to{ offset-distance:100%; } }
  @keyframes heartbeat{
    0%,100%{ transform:scale(1); }
    18%{ transform:scale(1.22); }
    32%{ transform:scale(.94); }
    46%{ transform:scale(1.1); }
    60%{ transform:scale(1); }
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @keyframes ripple{
    0%{ r:14; opacity:.35; }
    100%{ r:118; opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; }
    .ring-fill{ stroke-dashoffset:0; }
    .rider{ offset-distance:100%; }
    .brand,.tag{ opacity:1; transform:none; }
    .ripple{ opacity:0; }
  }
</style>

<g class="ticks">
  <line class="tick major" x1="126" y1="0" x2="140" y2="0"/>
  <line class="tick" x1="120.68" y1="32.4" x2="127.5" y2="34.3"/>
  <line class="tick" x1="106.07" y1="60.68" x2="112" y2="64.1"/>
  <line class="tick major" x1="89.10" y1="89.10" x2="98.9" y2="98.9"/>
  <line class="tick" x1="60.68" y1="106.07" x2="64.1" y2="112"/>
  <line class="tick" x1="32.4" y1="120.68" x2="34.3" y2="127.5"/>
  <line class="tick major" x1="0" y1="126" x2="0" y2="140"/>
  <line class="tick" x1="-32.4" y1="120.68" x2="-34.3" y2="127.5"/>
  <line class="tick" x1="-60.68" y1="106.07" x2="-64.1" y2="112"/>
  <line class="tick major" x1="-89.10" y1="89.10" x2="-98.9" y2="98.9"/>
  <line class="tick" x1="-106.07" y1="60.68" x2="-112" y2="64.1"/>
  <line class="tick" x1="-120.68" y1="32.4" x2="-127.5" y2="34.3"/>
  <line class="tick major" x1="-126" y1="0" x2="-140" y2="0"/>
  <line class="tick" x1="-120.68" y1="-32.4" x2="-127.5" y2="-34.3"/>
  <line class="tick" x1="-106.07" y1="-60.68" x2="-112" y2="-64.1"/>
  <line class="tick major" x1="-89.10" y1="-89.10" x2="-98.9" y2="-98.9"/>
  <line class="tick" x1="-60.68" y1="-106.07" x2="-64.1" y2="-112"/>
  <line class="tick" x1="-32.4" y1="-120.68" x2="-34.3" y2="-127.5"/>
  <line class="tick major" x1="0" y1="-126" x2="0" y2="-140"/>
  <line class="tick" x1="32.4" y1="-120.68" x2="34.3" y2="-127.5"/>
  <line class="tick" x1="60.68" y1="-106.07" x2="64.1" y2="-112"/>
  <line class="tick major" x1="89.10" y1="-89.10" x2="98.9" y2="-98.9"/>
  <line class="tick" x1="106.07" y1="-60.68" x2="112" y2="-64.1"/>
  <line class="tick" x1="120.68" y1="-32.4" x2="127.5" y2="-34.3"/>
</g>

<circle class="ripple r1" cx="0" cy="0" r="14"/>
<circle class="ripple r2" cx="0" cy="0" r="14"/>

<circle class="ring-track" r="120"/>
<circle class="ring-fill" r="120" transform="rotate(-90)"/>

<g class="rider">
  <circle class="r-halo" r="17"/>
  <circle class="r-dot" r="10"/>
  <path class="r-blip" d="M -5.5,0 H -2 L 0,-5 L 2.6,5.5 L 4.3,0 H 6"/>
</g>

<circle class="plate" r="88" cx="0" cy="8"/>

<g class="brand">
  <text class="hdfc" x="0" y="4" text-anchor="middle">HDFC <tspan class="life">Life</tspan></text>
</g>

<text class="tag" x="0" y="52" text-anchor="middle">SAR UTHA KE JIYO</text>

</svg>
