spring:
  application:
    name: jwt-auth-demo

server:
  port: 8080

app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:hdfc-jwt-demo-secret-key-must-be-at-least-32-bytes-long-2026}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:7d}

logging:
  level:
    root: INFO
    com.hdfclife.smartauth: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

login:
  rate-limit:
    limit-for-period: 5
    limit-refresh-period: 1m
    timeout-duration: 0s
    cleanup-interval-ms: 600000

  circuit-breaker:
    failure-rate-threshold: 50
    slow-call-rate-threshold: 100
    wait-duration-in-open-state: 30s
    slow-call-duration-threshold: 2s
    permitted-number-of-calls-in-half-open-state: 3
    minimum-number-of-calls: 5
    sliding-window-size: 10

